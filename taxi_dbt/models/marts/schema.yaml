version: 2

models:
    - name: dim_vendors
      description: >
        One row per taxi technology vendor (the company whose system recorded the trip).
        Built from the distinct vendor IDs in the combined yellow and green trip data,
        with names added by the `get_vendor_names` macro.
      columns:
        - name: vendor_id
          description: >
            Code of the vendor that provided the trip record, as reported by the TLC.
            Unique in this table; used to join trips to vendors.
        - name: vendor_name
          description: >
            Name of the vendor: 1 = Creative Mobile Technologies, LLC; 2 = VeriFone Inc.;
            4 = Unknown Vendor. Null for any vendor ID not mapped in the `get_vendor_names` macro.

    - name: dim_zones
      description: >
        One row per NYC TLC taxi zone. Used to turn the pickup and dropoff location IDs
        in the trip data into readable borough and zone names. Source: the TLC taxi
        zone lookup table, loaded from Postgres into BigQuery by Kestra.
      columns:
        - name: location_id
          description: >
            TLC taxi zone ID. Unique in this table; matches `pickup_location_id` and
            `dropoff_location_id` in the trip data.
        - name: borough
          description: >
            NYC borough the zone belongs to (Manhattan, Brooklyn, Queens, Bronx,
            Staten Island), or EWR for Newark Airport and Unknown for unassigned IDs.
        - name: zone
          description: Name of the taxi zone, e.g. "JFK Airport" or "Upper East Side North".
        - name: service_zone
          description: >
            TLC service area of the zone: Yellow Zone (where yellow taxis may pick up
            street hails), Boro Zone (where green taxis may), Airports, or EWR.
            Empty for the Unknown zones.

    - name: fct_trips
      description: >
        One row per taxi trip, yellow and green combined. The raw data contains the same
        trip more than once, so rows are combined when vendor, service type, pickup and
        dropoff time, pickup and dropoff zone, passenger count and trip distance all match.
        Exact copies are removed. Refunds (the same trip again with negative amounts) are
        added to the original trip, so refunded trips have a total of 0. See the
        taxi_dbt README for the full explanation.
      columns:
        - name: trip_id
          description: >
            Unique id of the trip. A hash of the columns that identify a trip:
            vendor, service type, pickup and dropoff time, pickup and dropoff zone, passenger count
            and trip distance.
          data_tests: 
            - unique
            - not_null 
        - name: service_type
          description: Whether the trip was made by a yellow or a green taxi ('yellow' or 'green').
        - name: payment_type
          description: >
            How the trip was paid: 1 = Credit card, 2 = Cash, 3 = No charge, 4 = Dispute,
            5 = Unknown, 6 = Voided trip. For refunded trips this is the reason for the
            refund (usually 3 or 4).
        - name: total_amount
          description: >
            Total amount charged, with refunds already subtracted. 0 for fully refunded
            trips. Negative for refunds whose original trip is not in the loaded data.
